<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Tapo Studio</title>
    <link rel="stylesheet" href="dialogs.css" />
  </head>
  <body class="about-page">
    <main class="card about-card">
      <h1>Tapo Studio</h1>
      <p>Version <span id="app-version"></span></p>
      <p>Desktop app for monitoring Tapo cameras and local recordings.</p>
      <p>
        Project GitHub:
        <a id="project-github-link" href="#" target="_blank" rel="noreferrer noopener"></a>
      </p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const version = params.get('version') || 'unknown';
      const github = params.get('github') || '';

      const versionNode = document.getElementById('app-version');
      if (versionNode) {
        versionNode.textContent = version;
      }

      const githubLink = document.getElementById('project-github-link');
      if (githubLink) {
        githubLink.textContent = github;
        githubLink.setAttribute('href', github);
      }
    </script>
  </body>
</html>
