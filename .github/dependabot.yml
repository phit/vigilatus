version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: monthly
    groups:
      patch-updates:
        update-types: ['patch']
      minor-updates:
        update-types: ['minor']
    open-pull-requests-limit: 5
    target-branch: 'develop'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    target-branch: 'develop'
